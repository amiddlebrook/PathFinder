<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathFinder: Offline-First Adventure Planner</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
      :root, [data-theme="dark"] {
        --color-bg-primary: #020617; /* slate-950 */
        --color-bg-secondary: #0f172a; /* slate-900 */
        --color-bg-tertiary: #1e293b; /* slate-800 */
        --color-bg-interactive: #334155; /* slate-700 */
        --color-bg-interactive-hover: #475569; /* slate-600 */
        --color-border: #334155; /* slate-700 */
        --color-border-subtle: #1e293b; /* slate-800 */
        --color-text-primary: #f1f5f9; /* slate-100 */
        --color-text-secondary: #94a3b8; /* slate-400 */
        --color-text-tertiary: #64748b; /* slate-500 */
        --color-accent: #6366f1; /* indigo-500 */
        --color-accent-hover: #4f46e5; /* indigo-600 */
        --color-accent-text: #c7d2fe; /* indigo-200 */
        --color-prose-body: #d1d5db;
      }
      [data-theme="light"] {
        --color-bg-primary: #f8fafc; /* slate-50 */
        --color-bg-secondary: #ffffff;
        --color-bg-tertiary: #f1f5f9; /* slate-100 */
        --color-bg-interactive: #e2e8f0; /* slate-200 */
        --color-bg-interactive-hover: #cbd5e1; /* slate-300 */
        --color-border: #e2e8f0; /* slate-200 */
        --color-border-subtle: #f1f5f9; /* slate-100 */
        --color-text-primary: #1e293b; /* slate-800 */
        --color-text-secondary: #475569; /* slate-600 */
        --color-text-tertiary: #94a3b8; /* slate-400 */
        --color-accent: #4f46e5; /* indigo-600 */
        --color-accent-hover: #4338ca; /* indigo-700 */
        --color-accent-text: #4f46e5; /* indigo-600 */
        --color-prose-body: #374151;
      }
      [data-theme="forest"] {
        --color-bg-primary: #052e16; /* green-950 */
        --color-bg-secondary: #064e3b; /* green-900 */
        --color-bg-tertiary: #047857; /* green-800 */
        --color-bg-interactive: #10b981; /* green-700 */
        --color-bg-interactive-hover: #059669; /* green-600 */
        --color-border: #065f46; /* green-800 */
        --color-border-subtle: #064e3b; /* green-900 */
        --color-text-primary: #ecfdf5; /* green-50 */
        --color-text-secondary: #a7f3d0; /* green-200 */
        --color-text-tertiary: #6ee7b7; /* green-300 */
        --color-accent: #22c55e; /* green-500 */
        --color-accent-hover: #16a34a; /* green-600 */
        --color-accent-text: #bbf7d0; /* green-200 */
        --color-prose-body: #d1fae5;
      }
      [data-theme="ocean"] {
        --color-bg-primary: #0c2444; /* custom blue */
        --color-bg-secondary: #11325f; /* custom blue */
        --color-bg-tertiary: #184785; /* custom blue */
        --color-bg-interactive: #2563eb; /* blue-600 */
        --color-bg-interactive-hover: #1d4ed8; /* blue-700 */
        --color-border: #173b70; /* custom blue */
        --color-border-subtle: #11325f; /* custom blue */
        --color-text-primary: #eff6ff; /* blue-50 */
        --color-text-secondary: #bfdbfe; /* blue-200 */
        --color-text-tertiary: #93c5fd; /* blue-300 */
        --color-accent: #3b82f6; /* blue-500 */
        --color-accent-hover: #2563eb; /* blue-600 */
        --color-accent-text: #dbeafe; /* blue-200 */
        --color-prose-body: #e0f2fe;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-bg-secondary);
        color: var(--color-text-primary);
        transition: background-color 0.3s, color 0.3s;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--color-bg-secondary); }
      ::-webkit-scrollbar-thumb { background: var(--color-bg-interactive); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-bg-interactive-hover); }
      .leaflet-control-zoom-in, .leaflet-control-zoom-out {
        background-color: var(--color-bg-tertiary) !important;
        color: var(--color-text-primary) !important;
        border: 1px solid var(--color-border) !important;
        border-radius: 0.5rem !important;
      }
       .leaflet-control-zoom-in:hover, .leaflet-control-zoom-out:hover {
        background-color: var(--color-bg-interactive) !important;
      }
      .leaflet-control-attribution {
        background: color-mix(in srgb, var(--color-bg-secondary) 70%, transparent) !important;
        color: var(--color-text-secondary) !important;
      }
      .leaflet-control-attribution a {
        color: var(--color-text-tertiary) !important;
      }
      .date-input-fix::-webkit-calendar-picker-indicator {
        filter: invert(0.8);
      }
      [data-theme="light"] .date-input-fix::-webkit-calendar-picker-indicator {
        filter: none;
      }
      .prose {
        color: var(--color-prose-body) !important;
      }
      .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
         color: var(--color-text-primary) !important;
      }
       .prose a {
         color: var(--color-accent-text) !important;
      }
       .prose strong {
         color: var(--color-text-primary) !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",

    "react/": "https://esm.sh/react@18.3.1/"
  }
}
</script>

</head>

  </body>
</html>
