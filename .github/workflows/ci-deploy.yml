name: Test and deploy PathFinder
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Validate Cloudflare Worker package
        run: npx wrangler deploy --dry-run
      - name: Publish to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify live Cloudflare app and APIs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          base="https://pathfinder.averymiddlebrook2014.workers.dev"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 "$base/" | grep -q 'PathFinder'
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 "$base/favicon.svg" | grep -q '<svg'
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 "$base/api/geocode?name=Denver" | python3 -c "import json,sys; v=json.load(sys.stdin); assert isinstance(v['lat'],(int,float)) and isinstance(v['lng'],(int,float))"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 "$base/api/weather?name=Denver" | python3 -c "import json,sys; v=json.load(sys.stdin); assert len(v['daily'])==7 and len(v['hourly'])==8"
